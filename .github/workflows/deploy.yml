name: Data Pipeline Deploy Databricks

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'terraform/**'
      - 'notebooks/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'terraform/**'
      - 'notebooks/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform Lint, Plan & Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      TF_VAR_databricks_host: ${{ secrets.DATABRICKS_HOST }}
      TF_VAR_databricks_token: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color

      - name: Terraform Apply
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
        run: terraform apply -auto-approve -no-color
